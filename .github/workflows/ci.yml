name: PR Test Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-test-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run Pact contract tests
        run: npm run test:contract

  coverage-gate:
    name: Critical logic coverage gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run critical logic coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-logic-coverage
          path: qa-artifacts/coverage/
          if-no-files-found: ignore

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  load-tests:
    name: Load tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run k6 PR load test
        run: |
          mkdir -p qa-artifacts
          node dist/src/server.js &
          api_pid=$!
          trap "kill $api_pid" EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/health > /dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:4173/health > /dev/null; then
            echo "FoodHub API did not become healthy in time"
            exit 1
          fi

          docker run --rm --network host \
            -e BASE_URL=http://127.0.0.1:4173 \
            -e VUS=1 \
            -e RAMP_UP=5s \
            -e STEADY_STATE=10s \
            -e RAMP_DOWN=5s \
            -e THINK_TIME_SECONDS=0.2 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            grafana/k6:2.0.0 run tests/load/foodhub-api.k6.js

      - name: Upload load test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-summary
          path: qa-artifacts/load-test-summary.json
          if-no-files-found: ignore

  qa-report:
    name: QA report artifacts
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - contract-tests
      - coverage-gate
      - e2e-tests
      - load-tests
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: critical-logic-coverage
          path: qa-artifacts/coverage/
        continue-on-error: true

      - name: Download load test summary
        uses: actions/download-artifact@v4
        with:
          name: load-test-summary
          path: qa-artifacts/
        continue-on-error: true

      - name: Generate QA test report
        run: npm run test:report

      - name: Generate AI coverage workbook
        if: ${{ vars.FOODHUB_AI_LIVE == 'true' }}
        run: npm run ai:coverage
        env:
          FOODHUB_AI_LIVE: ${{ vars.FOODHUB_AI_LIVE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Generate AI failure analysis prompt
        if: ${{ vars.FOODHUB_AI_LIVE != 'true' }}
        run: npm run ai:analyze-failures -- tests/fixtures/failureLogs/sample-flaky-log.txt

      - name: Upload QA test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodhub-qa-test-artifacts
          path: qa-artifacts/
          if-no-files-found: ignore
